name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Minimal permissions: the test workflow only needs to read source.
# Lints, tests, consistency checks, and the devteam-doctor smoke test
# don't write to issues, PRs, packages, or anything else. CodeQL flags
# workflows without explicit permissions because the default
# GITHUB_TOKEN otherwise has overly-broad write scope.
permissions:
  contents: read

# A force-push or follow-up commit supersedes the older run for the same PR.
# Main stays in its own group, so unrelated pull requests never cancel each other.
concurrency:
  group: test-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows-smoke:
    name: windows smoke (node 22)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run native portability tests
        run: node --test tests/command-line.test.js tests/posix-only.test.js tests/process-kill.test.js tests/windows-smoke.test.js

      - name: Verify CLI help, init, and doctor
        shell: pwsh
        run: |
          node bin/devteam help
          $target = Join-Path $env:RUNNER_TEMP "stagecraft-windows-smoke"
          node bin/devteam init --host generic --cwd $target
          node bin/devteam doctor --cwd $target

  evals-stub:
    name: evals structural regression check (33.2)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # plans/phase-33-eval-flywheel.md item 33.2: replay the checked-in
      # fixture corpus's cases (tests/fixtures/evals/) against THIS repo's
      # current framework — free, no model. Catches a role brief/rules/
      # render-helpers change that silently breaks prompt rendering for a
      # stage/role the corpus covers, independent of the full test suite.
      - name: Run devteam evals run --stub over the fixture corpus
        run: |
          TARGET=$(mktemp -d)
          mkdir -p "$TARGET/.devteam/evals"
          cp -R tests/fixtures/evals/cases "$TARGET/.devteam/evals/cases"
          cp -R tests/fixtures/evals/blobs "$TARGET/.devteam/evals/blobs"
          ./bin/devteam evals run --stub --cwd "$TARGET"

  test:
    name: node ${{ matrix.node-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # Test the minimum supported Maintenance LTS and the Active LTS.
        # Node 20 reached EOL in 2026 and is no longer a supported runtime.
        node-version: ['22', '24']

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        if: matrix.node-version == '22'
        run: npm run lint

      # CI probe: create an untracked scratch file before npm test to verify that
      # untracked files no longer block the suite (fix/git-aware-consistency, item 7.1).
      # Red on the pre-fix main; green after. Kept permanently as a regression guard.
      - name: Create CI probe file (untracked scratch file)
        run: echo "ci-probe" > docs/SCRATCH-ci-probe.md

      - name: Run test suite
        run: npm test
        env:
          DEVTEAM_HEADLESS_COMMAND: cat

      - name: Remove CI probe file
        if: always()
        run: rm -f docs/SCRATCH-ci-probe.md

      # Coverage report — report-only, never fails the build.
      # Baseline is in .github/coverage-baseline.json (a diff, not a comment).
      # No threshold is set yet; thresholds without history invite gaming. Run
      # this telemetry after merges so it does not double pull-request latency.
      - name: Coverage report (informational)
        if: matrix.node-version == '22' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: coverage
        continue-on-error: true
        run: |
          node --test --experimental-test-coverage tests/*.test.js \
            2>&1 | tee coverage-report.txt
          # Emit summary to the GitHub step summary so numbers are visible
          # without opening the log — one click from the PR checks list.
          if [ -n "$GITHUB_STEP_SUMMARY" ]; then
            echo "## Coverage report" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            grep -E '(lines|branches|functions|uncovered)' coverage-report.txt \
              >> "$GITHUB_STEP_SUMMARY" || true
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "_Baseline in [.github/coverage-baseline.json](../../.github/coverage-baseline.json)_" \
              >> "$GITHUB_STEP_SUMMARY"
          fi
        env:
          DEVTEAM_HEADLESS_COMMAND: cat

      - name: Upload coverage report
        if: always() && matrix.node-version == '22' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-node22
          path: coverage-report.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Run consistency checks
        if: matrix.node-version == '22'
        run: npm run consistency

      - name: Verify devteam CLI loads
        run: ./bin/devteam help

      - name: Verify devteam doctor against a fresh init
        run: |
          TARGET=$(mktemp -d)
          ./bin/devteam init --host claude-code --cwd "$TARGET"
          ./bin/devteam doctor --cwd "$TARGET"

      - name: First-30-minutes onboarding smoke
        # Executes the README's "First 30 minutes" onboarding steps so the
        # instructions are run, not just proofread.
        # DEVTEAM_HEADLESS_COMMAND=cat renders the prompt to stdout without
        # invoking a model (offline-safe). The stage command exits non-zero
        # because cat doesn't write a gate — that's expected and intentional.
        # The || true lets the step continue; we then assert the rendered prompt
        # content appeared (proof that devteam stage actually ran and produced
        # output, not just that it didn't crash) and pin devteam next to the
        # two actions that mean "stage ran but no gate was written yet".
        run: |
          TARGET=$(mktemp -d)
          STAGE_OUT=$(mktemp)
          ./bin/devteam init --host claude-code --cwd "$TARGET"
          ./bin/devteam doctor --cwd "$TARGET"
          DEVTEAM_HEADLESS_COMMAND=cat DEVTEAM_HEADLESS_TEE=1 ./bin/devteam stage requirements \
            --feature "smoke test feature" --headless --cwd "$TARGET" \
            > "$STAGE_OUT" 2>&1 || true
          cat "$STAGE_OUT"
          # Assert the rendered prompt contains the requirements-role header.
          # If devteam stage crashes before rendering, this grep fails the step.
          grep -q "Stage stage-01" "$STAGE_OUT" \
            || { echo "✗ expected 'Stage stage-01' in stage output"; exit 1; }
          ACTION=$(./bin/devteam next --json --cwd "$TARGET" | jq -r '.action')
          echo "devteam next action: $ACTION"
          case "$ACTION" in
            run-stage|continue-stage)
              echo "✓ valid post-headless action: $ACTION" ;;
            *)
              echo "✗ unexpected action from devteam next: $ACTION" && exit 1 ;;
          esac

      - name: Changelog fragment guard
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          # Default checkout is shallow (depth 1); fetch the base branch so the
          # diff is available. GITHUB_BASE_REF is set to e.g. "main" for PRs.
          git fetch --depth=1 origin "$GITHUB_BASE_REF"
          BASE_REF="origin/$GITHUB_BASE_REF"
          GUARD_CHANGED=$(git diff --name-only "$BASE_REF" HEAD)
          GUARD_FRAGMENTS=$(git diff --name-only --diff-filter=AM "$BASE_REF" HEAD \
            | grep '^changelog\.d/.*\.md$' | grep -v 'README\.md' || true)
          GUARD_SKIP="$PR_TITLE"$'\n'$(git log --format=%s "$BASE_REF"..HEAD)
          export GUARD_CHANGED GUARD_FRAGMENTS GUARD_SKIP
          node scripts/changelog-guard.js
